name: CI ms-votos

on:
  push:
    paths:
      - "ms-votos/**"
      - ".github/workflows/ci.yml"

  pull_request:
    paths:
      - "ms-votos/**"
      - ".github/workflows/ci.yml"

jobs:
  verificar:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ms-votos

    steps:
      - name: Traer código
        uses: actions/checkout@v4

      - name: Preparar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ms-votos/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Análisis estático
        run: npx eslint src tests --max-warnings 0

      - name: Ejecutar pruebas
        run: npm test

      - name: Generar cobertura
        run: npm run test:cov

      - name: Publicar cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-ms-votos-${{ github.sha }}
          path: ms-votos/coverage/
          retention-days: 7

  publicar:
    needs: verificar
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Traer código
        uses: actions/checkout@v4

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: ./ms-votos
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ms-votos:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/ms-votos:1.0.0
            ghcr.io/${{ github.repository_owner }}/ms-votos:latest